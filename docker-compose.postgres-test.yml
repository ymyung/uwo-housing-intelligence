services:
  postgres-test:
    image: uwo-postgres-postgis:15
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: uwo_housing_test
      POSTGRES_USER: uwo_housing_test
      POSTGRES_PASSWORD: uwo_housing_test_only
    ports:
      - "127.0.0.1:${UWO_POSTGRES_TEST_PORT:-55601}:5432"
    volumes:
      - uwo_housing_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uwo_housing_test -d uwo_housing_test"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: "no"

volumes:
  uwo_housing_postgres_test_data:
    name: uwo_housing_postgres_test_data
